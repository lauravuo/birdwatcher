name: Release and Deploy

on:
  push:
    branches:
      - main

jobs:
  deploy:
    name: Release
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'
      - run: npm pkg delete scripts.prepare
      - run: npm ci
      - run: npm run build
        env:
          VITE_FIREBASE_API_KEY: ${{ secrets.VITE_FIREBASE_API_KEY }}
          VITE_FIREBASE_AUTH_DOMAIN: ${{ secrets.VITE_FIREBASE_AUTH_DOMAIN }}
          VITE_FIREBASE_PROJECT_ID: ${{ secrets.VITE_FIREBASE_PROJECT_ID }}
          VITE_FIREBASE_STORAGE_BUCKET: ${{ secrets.VITE_FIREBASE_STORAGE_BUCKET }}
          VITE_FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.VITE_FIREBASE_MESSAGING_SENDER_ID }}
          VITE_FIREBASE_APP_ID: ${{ secrets.VITE_FIREBASE_APP_ID }}
      - name: Semantic Release
        uses: cycjimmy/semantic-release-action@v6
        id: semantic
        with:
          semantic_version: 24
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Deploy Firestore Rules
        if: steps.semantic.outputs.new_release_published == 'true'
        run: |
          echo '${{ secrets.FIREBASE_SERVICE_ACCOUNT_BIRD_WATCHER }}' > "$HOME/gcp_key.json"
          export GOOGLE_APPLICATION_CREDENTIALS="$HOME/gcp_key.json"
          npx firebase deploy --only firestore:rules,firestore:indexes --project birdwatcher-ac749

      - name: Cleanup Credentials
        if: always()
        run: rm -f "$HOME/gcp_key.json"

          
      - name: Deploy Hosting
        if: steps.semantic.outputs.new_release_published == 'true'
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: '${{ secrets.GITHUB_TOKEN }}'
          firebaseServiceAccount: '${{ secrets.FIREBASE_SERVICE_ACCOUNT_BIRD_WATCHER }}'
          channelId: live
          projectId: birdwatcher-ac749
