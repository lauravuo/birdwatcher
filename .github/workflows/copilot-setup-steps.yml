name: "Copilot Setup Steps"

on:
  workflow_call:

jobs:
  copilot-setup-steps:
    runs-on: ubuntu-latest

    steps:
      # Step 1: Set up Node.js with version 22 and enable caching for npm
      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: 22
          cache: 'npm' # Use caching for npm dependencies

      # Step 2: Install Playwright browsers with caching and run npm ci
      - name: Cache Playwright browsers
        uses: actions/cache@v3
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('**/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-playwright-

      - name: Install Node.js dependencies and Playwright
        run: |
          npm ci
          npx playwright install

      # Step 3: Set up Java with version 21 and make it the default
      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          java-package: jdk
          check-latest: false
          
      # Step 3b: Explicitly set Java 21 as default and verify
      - name: Configure Java 21 as default
        run: |
          # Export JAVA_HOME to GitHub environment
          echo "JAVA_HOME=$JAVA_HOME" >> $GITHUB_ENV
          echo "$JAVA_HOME/bin" >> $GITHUB_PATH
          
          # Update alternatives to make Java 21 the default (for systems that use it)
          if command -v update-alternatives &> /dev/null; then
            sudo update-alternatives --set java $JAVA_HOME/bin/java || true
          fi
          
          # Verify Java version
          echo "Verifying Java version:"
          java -version
          echo "JAVA_HOME is set to: $JAVA_HOME"
          
          # Ensure Java 21 is being used
          JAVA_VERSION=$(java -version 2>&1 | awk -F '"' '/version/ {print $2}' | cut -d'.' -f1)
          if [ "$JAVA_VERSION" -lt 21 ]; then
            echo "ERROR: Java version is $JAVA_VERSION but 21 or higher is required!"
            exit 1
          fi
          echo "✓ Java 21+ is configured correctly"

      # Step 4: Cache Firebase emulators
      - name: Cache Firebase emulators
        uses: actions/cache@v3
        with:
          path: ~/.cache/firebase/emulators
          key: ${{ runner.os }}-firebase-emulators-${{ hashFiles('firebase.json') }}
          restore-keys: |
            ${{ runner.os }}-firebase-emulators-

      # Step 5: Download Firebase emulators to avoid firewall issues during work
      - name: Download Firebase emulators
        run: |
          # Use the locally installed firebase from node_modules
          ./node_modules/.bin/firebase setup:emulators:firestore
          ./node_modules/.bin/firebase setup:emulators:ui
        continue-on-error: false
        env:
          JAVA_HOME: ${{ env.JAVA_HOME }}
