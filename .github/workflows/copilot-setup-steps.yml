name: "Copilot Setup Steps"

# Automatically run the setup steps when they are changed to allow for easy validation, and
# allow manual testing through the repository's "Actions" tab
on:
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/copilot-setup-steps.yml
  pull_request:
    paths:
      - .github/workflows/copilot-setup-steps.yml

jobs:
  # The job MUST be called `copilot-setup-steps` or it will not be picked up by Copilot.
  copilot-setup-steps:
    runs-on: ubuntu-latest

    # Set the permissions to the lowest permissions possible needed for your steps.
    # Copilot will be given its own token for its operations.
    permissions:
      # If you want to clone the repository as part of your setup steps, for example to install dependencies, you'll need the `contents: read` permission. If you don't clone the repository in your setup steps, Copilot will do this for you automatically after the steps complete.
      contents: read

    # You can define any steps you want, and they will run before the agent starts.
    # If you do not check out your code, Copilot will do this for you.
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: "npm"

      - name: Install JavaScript dependencies
        run: npm ci

      # Cache Playwright browsers
      - name: Cache Playwright browsers
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('**/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-playwright-

      - name: Install Node.js dependencies and Playwright
        run: npx playwright install

      # Set up Java with version 21 or higher
      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Cache Firebase emulators
        uses: actions/cache@v6
        with:
          path: ~/.cache/firebase/emulators
          key: ${{ runner.os }}-firebase-emulators-${{ hashFiles('firebase.json') }}
          restore-keys: |
            ${{ runner.os }}-firebase-emulators-

      # Download Firebase emulators to avoid firewall issues during work
      - name: Download Firebase emulators
        run: |
          npx firebase-tools setup:emulators:firestore
          npx firebase-tools setup:emulators:ui
        continue-on-error: false

      - name: Trust Dicebear Certificate in Chromium
        run: |
          # 1. Install NSS tools (needed for Chromium's cert database)
          sudo apt-get update
          sudo apt-get install -y libnss3-tools

          # 2. Extract the certificate from Dicebear directly
          if ! openssl s_client -showcerts -connect api.dicebear.com:443 </dev/null 2>&1 | openssl x509 -outform PEM > dicebear.crt; then
            echo "Failed to extract certificate from api.dicebear.com"
            exit 1
          fi

          # 3. Initialize and add to Chromium's NSS database
          mkdir -p $HOME/.pki/nssdb
          certutil -d sql:$HOME/.pki/nssdb -N --empty-password
          certutil -d sql:$HOME/.pki/nssdb -A -t "CT,," -n "Dicebear-API" -i dicebear.crt

          # 4. Also tell Node.js to trust it for any API calls in your tests
          echo "NODE_EXTRA_CA_CERTS=$(pwd)/dicebear.crt" >> $GITHUB_ENV
