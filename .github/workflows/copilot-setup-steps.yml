name: Copilot Setup Steps

on:
  workflow_call:

jobs:
  copilot-setup-steps:
    runs-on: ubuntu-latest

    steps:
      # Step 1: Set up Node.js
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      # Step 2: Install Firebase Tools globally
      - name: Install Firebase Tools
        run: npm install -g firebase-tools

      # Step 3: Pre-download Firebase Emulators (Magic step - before firewall)
      - name: Pre-download Firebase Emulators
        run: firebase setup:emulators:firestore,auth

      # Step 4: Install project dependencies
      - name: Install Dependencies
        run: npm install

      # Step 5: Set up Java (required for Firebase emulators)
      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: 'oracle'
          java-version: '21'
