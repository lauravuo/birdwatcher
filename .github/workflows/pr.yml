name: PR Checks

on:
  pull_request:

jobs:
  build_and_test:
    name: Build and Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          distribution: 'oracle'
          java-version: '21'
      - uses: actions/setup-node@v6
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'
      - run: npm ci
      - run: npm run lint
      - run: npm run test
      - run: npm run build
      - name: Cache Playwright browsers
        uses: actions/cache@v5
        id: playwright-cache
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('**/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-playwright-
      - name: Install Playwright Browsers
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps
      - name: Trust Dicebear Certificate in Chromium
        run: |
          # 1. Install NSS tools (needed for Chromium's cert database)
          sudo apt-get update
          sudo apt-get install -y libnss3-tools

          # 2. Extract the certificate from Dicebear directly
          openssl s_client -showcerts -connect api.dicebear.com:443 </dev/null 2>/dev/null | openssl x509 -outform PEM > dicebear.crt

          # 3. Initialize and add to Chromium's NSS database
          mkdir -p $HOME/.pki/nssdb
          certutil -d sql:$HOME/.pki/nssdb -N --empty-password
          certutil -d sql:$HOME/.pki/nssdb -A -t "CT,," -n "Dicebear-API" -i dicebear.crt

          # 4. Also tell Node.js to trust it for any API calls in your tests
          echo "NODE_EXTRA_CA_CERTS=$(pwd)/dicebear.crt" >> $GITHUB_ENV
      - name: Run E2E tests with Emulator
        run: npm run test:e2e:emulator
      - uses: actions/upload-artifact@v6
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 30
